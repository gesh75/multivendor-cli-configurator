<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="-apple-system, Segoe UI, Inter, Roboto, sans-serif">
  <rect width="1100" height="540" fill="#0a0e15"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#e5e7eb">Anatomy of a command card</text>
  <text x="40" y="62" font-size="12" fill="#94a3b8">From browsing to a runnable automation snippet in 2 clicks.</text>

  <!-- The card -->
  <g transform="translate(40, 90)">
    <rect width="520" height="380" rx="12" fill="#0f1721" stroke="#334155"/>
    <!-- Vendor stripe (Cisco blue) -->
    <rect x="0" y="0" width="4" height="380" fill="#1769b8"/>
    <!-- title row -->
    <text x="22" y="36" font-size="14" font-weight="700" fill="#e2e8f0">router bgp [ASN]</text>
    <text x="498" y="34" font-size="18" fill="#94a3b8" text-anchor="end">★</text>
    <text x="22" y="58" font-size="11" fill="#94a3b8">BGP &gt; Configure neighbor</text>
    <!-- code block -->
    <rect x="22" y="76" width="476" height="92" rx="6" fill="#070b12" stroke="#1f2937"/>
    <text x="36" y="98" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#22d3ee">router bgp 65001</text>
    <text x="36" y="116" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#cbd5e1"> neighbor 10.0.0.2 remote-as 65002</text>
    <text x="36" y="134" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#cbd5e1"> address-family ipv4 unicast</text>
    <text x="36" y="152" font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#cbd5e1">  neighbor 10.0.0.2 activate</text>
    <!-- badges -->
    <rect x="22" y="184" width="56" height="20" rx="10" fill="#0d4f8b"/>
    <text x="50" y="198" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">Cisco</text>
    <rect x="86" y="184" width="84" height="20" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="128" y="198" font-size="10" fill="#cbd5e1" text-anchor="middle">IOS / IOS-XE</text>
    <rect x="178" y="184" width="50" height="20" rx="10" fill="#1f2937" stroke="#334155"/>
    <text x="203" y="198" font-size="10" fill="#cbd5e1" text-anchor="middle">router</text>
    <rect x="236" y="184" width="42" height="20" rx="10" fill="#0f3744" stroke="#22d3ee"/>
    <text x="257" y="198" font-size="10" fill="#22d3ee" text-anchor="middle">BGP</text>
    <!-- actions -->
    <rect x="22" y="222" width="64" height="28" rx="6" fill="#1f2937" stroke="#334155"/>
    <text x="54" y="240" font-size="11" fill="#e2e8f0" text-anchor="middle">Copy</text>
    <rect x="94" y="222" width="64" height="28" rx="6" fill="#22d3ee"/>
    <text x="126" y="240" font-size="11" font-weight="600" fill="#0a0e15" text-anchor="middle">+ CLI</text>
    <rect x="166" y="222" width="92" height="28" rx="6" fill="#1f2937" stroke="#334155"/>
    <text x="212" y="240" font-size="11" fill="#e2e8f0" text-anchor="middle">↔ Compare</text>
    <rect x="266" y="222" width="36" height="28" rx="6" fill="#1f2937" stroke="#334155"/>
    <text x="284" y="240" font-size="13" fill="#e2e8f0" text-anchor="middle">⋯</text>
    <!-- arrow from ⋯ to overflow menu -->
    <line x1="284" y1="252" x2="284" y2="288" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- overflow menu -->
    <rect x="180" y="290" width="248" height="74" rx="8" fill="#0f1721" stroke="#a78bfa"/>
    <rect x="186" y="296" width="236" height="28" rx="5" fill="url(#yangG)"/>
    <text x="304" y="314" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">⚡ Automate (YANG, model-driven)</text>
    <rect x="186" y="328" width="236" height="28" rx="5" fill="#1f2937"/>
    <text x="304" y="346" font-size="11" fill="#cbd5e1" text-anchor="middle">↗ See cross-vendor equivalents</text>
  </g>

  <!-- Arrows + automation panel -->
  <text x="600" y="120" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1.4">CLICK ⚡ Automate (YANG)</text>
  <path d="M 580 130 L 612 130" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(620, 90)">
    <rect width="440" height="380" rx="12" fill="#0f1721" stroke="#a78bfa"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#e2e8f0">⚡ AUTOMATE — model-driven</text>
    <text x="20" y="52" font-size="10" fill="#94a3b8">Values extracted from your command via regex.</text>

    <rect x="20" y="68" width="400" height="46" rx="6" fill="#1c2333" stroke="#334155"/>
    <text x="34" y="86" font-size="10" font-weight="600" fill="#a78bfa" letter-spacing=".8">⚙ PARAMETERS</text>
    <text x="34" y="104" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">host=10.0.0.2 · asn=65001 · peer-asn=65002 · vrf=default</text>

    <rect x="20" y="124" width="400" height="80" rx="6" fill="#070b12" stroke="#1f2937"/>
    <text x="34" y="142" font-size="10" font-weight="600" fill="#7c3aed">NETCONF / OpenConfig XML</text>
    <text x="34" y="160" font-size="10" font-family="ui-monospace,monospace" fill="#22d3ee">&lt;bgp xmlns=...&gt;</text>
    <text x="34" y="174" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">  &lt;global&gt;&lt;config&gt;&lt;as&gt;65001&lt;/as&gt;…</text>
    <text x="34" y="188" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">  &lt;neighbors&gt;…&lt;peer-as&gt;65002&lt;/peer-as&gt;…</text>

    <rect x="20" y="214" width="400" height="80" rx="6" fill="#070b12" stroke="#1f2937"/>
    <text x="34" y="232" font-size="10" font-weight="600" fill="#7c3aed">ncclient (Python)</text>
    <text x="34" y="250" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">from ncclient import manager</text>
    <text x="34" y="264" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">with manager.connect(host=...) as m:</text>
    <text x="34" y="278" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">    m.edit_config(target="candidate", config=...)</text>

    <rect x="20" y="304" width="400" height="60" rx="6" fill="#070b12" stroke="#1f2937"/>
    <text x="34" y="322" font-size="10" font-weight="600" fill="#7c3aed">Ansible (cisco.ios.ios_bgp_global)</text>
    <text x="34" y="340" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">- name: BGP — peer 65002</text>
    <text x="34" y="354" font-size="10" font-family="ui-monospace,monospace" fill="#cbd5e1">  cisco.ios.ios_bgp_global: …</text>
  </g>

  <text x="540" y="510" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">15 native YANG mappings · universal SSH/Netmiko/Ansible/NAPALM fallback for every other command.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <linearGradient id="yangG" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
</svg>
