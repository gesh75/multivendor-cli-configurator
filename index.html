<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Multivendor GUI Configurator — Cisco · Juniper · Arista</title>
<style>
:root[data-theme="dark"]{
  --bg:#000;--panel:#0a0f0a;--panel-2:#0d140d;--line:#1a3d1a;--line-2:#0e2810;
  --ink:#c8ffc8;--ink-dim:#5e8a5e;--ink-muted:#3d5d3d;
  --accent:#39ff14;--accent-2:#22d3ee;--warn:#ffb020;--bad:#ff5050;--good:#0aff0a;
  --code-bg:#000;
  --kw:#39ff14;--ip:#ffb020;--num:#ffb020;--str:#c8ffc8;--cmt:#4a7d4d;--ifname:#a78bfa;
  --cisco:#3b82f6;--juniper:#22c55e;--arista:#a855f7;
}
:root[data-theme="light"]{
  --bg:#f8faf6;--panel:#ffffff;--panel-2:#eef6ee;--line:#cbe0cb;--line-2:#dceadc;
  --ink:#0e3812;--ink-dim:#3d6b3d;--ink-muted:#8aa78a;
  --accent:#0e7c2c;--accent-2:#0e7490;--warn:#b45309;--bad:#dc2626;--good:#15803d;
  --code-bg:#06190a;
  --kw:#9cffa0;--ip:#ffb020;--num:#ffb020;--str:#c8ffc8;--cmt:#7da77f;--ifname:#a78bfa;
  --cisco:#1d4ed8;--juniper:#15803d;--arista:#7e22ce;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;transition:background .15s,color .15s}
button,select,input{font-family:inherit}

/* Topbar */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{font-weight:700;color:var(--accent);letter-spacing:1px;font-size:14px}
.brand small{color:var(--ink-dim);margin-left:8px;font-weight:400}
.field{display:flex;align-items:center;gap:6px}
.field label{color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.field input,.field select{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:5px 8px;font:12px var(--mono,'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace);outline:0;border-radius:4px}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 4px rgba(57,255,20,.35)}
.tabs{display:flex;gap:0}
.tab{padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;font:11px inherit;letter-spacing:1px;text-transform:uppercase}
.tab+.tab{border-left:0}
.tab.on{color:var(--accent);border-color:var(--accent);background:rgba(57,255,20,.06)}
.tab:hover{color:var(--ink)}
.tbtn{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:5px;cursor:pointer;font:11px inherit;letter-spacing:.5px}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:rgba(57,255,20,.08);border-color:var(--accent);color:var(--accent)}

/* Three-zone shell with CSS resizers */
.shell{display:grid;grid-template-columns:var(--lcol,200px) 6px 1fr 6px var(--rcol,460px);height:calc(100vh - 49px)}
.shell.lcollapsed{grid-template-columns:0 0 1fr 6px var(--rcol,460px)}
.shell.diff{--rcol:760px}
.gutter{background:var(--line-2);cursor:col-resize;position:relative}
.gutter:hover{background:var(--accent)}
.gutter::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:24px;background:var(--ink-muted);border-radius:1px}

/* Sidebar */
.side{background:var(--panel);overflow:auto;display:flex;flex-direction:column;min-width:0}
.side .ssearch{padding:8px 10px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel);z-index:2}
.side .ssearch input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:5px 8px;border-radius:4px;outline:0;font-size:12px}
.side .ssearch input:focus{border-color:var(--accent)}
.side h4{margin:12px 12px 4px;font-size:10px;color:var(--ink-dim);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column}
.nav a{padding:7px 12px;color:var(--ink-dim);cursor:pointer;border-left:2px solid transparent;text-decoration:none;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:6px;user-select:none}
.nav a:hover{color:var(--ink);background:rgba(57,255,20,.04)}
.nav a.on{color:var(--accent);border-left-color:var(--accent);background:rgba(57,255,20,.08)}
.nav a .stbadge{font-size:11px;width:14px;text-align:center}
.nav a .stbadge.empty{color:var(--ink-muted)}
.nav a .stbadge.filled{color:var(--good)}
.nav a .stbadge.partial{color:var(--warn)}
.nav a.hidden{display:none}
.side .footer{margin-top:auto;padding:8px 10px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}

/* Canvas */
.canvas{overflow:auto;padding:16px 22px;min-width:0;background:var(--bg)}
.sec-title{color:var(--accent);font-size:14px;letter-spacing:1px;margin:0 0 14px;font-weight:500;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"# ";color:var(--ink-dim)}
.sec-sub{font-size:11px;color:var(--ink-muted);text-transform:none;letter-spacing:0;margin-left:auto;font-weight:400}

/* Cards (group separators) */
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:14px;margin-bottom:12px}
.card .card-title{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1.2px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.entry{border-top:1px solid var(--line-2);padding:12px 0;position:relative}
.entry:first-of-type{border-top:0;padding-top:0}
.entry .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.entry .name{color:var(--accent);font-weight:600;letter-spacing:.5px;font-size:13px}
.entry .badges{display:flex;gap:6px;margin-left:auto;align-items:center}
.pill{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);background:var(--bg)}
.pill.up{color:var(--good);border-color:var(--good);background:rgba(10,255,10,.08)}
.pill.down{color:var(--bad);border-color:#5a1010;background:rgba(255,80,80,.08)}

.row{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:10px;padding:4px 0;font-size:13px}
.row label{color:var(--ink-dim);font-size:12px;display:flex;align-items:center;gap:5px}
.row input,.row select{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:5px 9px;font:12.5px inherit;outline:0;border-radius:4px;width:100%}
.row input::placeholder{color:var(--ink-muted)}
.row input:focus,.row select:focus{border-color:var(--accent);box-shadow:0 0 4px rgba(57,255,20,.2)}
.row .check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim)}
.row .check input{width:auto}

/* Tooltip */
.tip{cursor:help;color:var(--ink-muted);font-size:11px;border:1px solid var(--line);border-radius:999px;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tip:hover{color:var(--accent);border-color:var(--accent)}
.tip[data-tip]{position:relative}
.tip[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:18px;top:-4px;background:var(--panel-2);color:var(--ink);border:1px solid var(--accent);padding:5px 9px;border-radius:5px;font-size:11px;white-space:nowrap;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.4)}

.add{margin-top:12px;background:transparent;border:1px dashed var(--line);color:var(--ink-dim);padding:8px 12px;cursor:pointer;font:12px inherit;width:100%;border-radius:4px}
.add:hover{border-color:var(--accent);color:var(--accent)}
.btn-x{background:transparent;border:1px solid var(--line-2);color:var(--ink-dim);cursor:pointer;font:11px inherit;padding:3px 7px;border-radius:4px}
.btn-x:hover{color:var(--bad);border-color:var(--bad)}

/* ACL row table */
.acl-table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12px;margin-top:8px}
.acl-table th{text-align:left;color:var(--ink-dim);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:0 6px 4px;font-weight:600}
.acl-table td{padding:0 4px}
.acl-table td input,.acl-table td select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:4px 6px;font:12px inherit;border-radius:4px;outline:0}
.acl-table td input:focus,.acl-table td select:focus{border-color:var(--accent)}
.acl-table td.seq{color:var(--ink-muted);text-align:right;font-size:11px;padding-right:8px}
.acl-table .colw-seq{width:42px}.acl-table .colw-act{width:80px}.acl-table .colw-pr{width:70px}.acl-table .colw-port{width:90px}.acl-table .colw-x{width:30px}
.acl-table tr:hover td{background:var(--panel-2)}

/* CLI panel */
.cli{background:var(--code-bg);display:flex;flex-direction:column;min-width:0;position:relative}
.cli .hdr{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:3}
.cli .hdr .t{color:var(--ink-dim);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.cli .hdr .live{color:var(--good);font-size:10px;background:rgba(10,255,10,.08);border:1px solid var(--good);padding:1px 6px;border-radius:3px;animation:pulse 2s infinite;margin-left:6px}
@keyframes pulse{50%{opacity:.55}}
.cli .hdr .right{display:flex;gap:5px;align-items:center}
.cli .body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.cli .body.split{flex-direction:row}
.cli pre{margin:0;padding:14px;flex:1;overflow:auto;color:var(--ink);font:12.5px/1.6 inherit;text-shadow:0 0 1px rgba(57,255,20,.15);white-space:pre;tab-size:2;min-width:0}
.cli .splitcol{flex:1;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line-2)}
.cli .splitcol:first-child{border-left:0}
.cli .splitcol .colhdr{padding:6px 12px;background:var(--panel-2);border-bottom:1px solid var(--line-2);font:11px inherit;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);position:sticky;top:0}
.cli .splitcol.cisco .colhdr{color:var(--cisco)}
.cli .splitcol.juniper .colhdr{color:var(--juniper)}
.cli .splitcol.arista .colhdr{color:var(--arista)}
.cli pre .c{color:var(--cmt);font-style:italic;cursor:pointer;text-decoration:underline dotted transparent;text-underline-offset:3px}
.cli pre .c.anchor:hover{color:var(--accent);text-decoration-color:var(--accent)}
.cli pre .k{color:var(--kw);font-weight:500}
.cli pre .ip{color:var(--ip)}
.cli pre .num{color:var(--num)}
.cli pre .if{color:var(--ifname)}
.cli pre .v{color:var(--ink)}
.cli .ftr{padding:6px 10px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:5px;font-size:11px;color:var(--ink-muted)}

/* Responsive */
@media (max-width:1100px){
  .shell{grid-template-columns:1fr;height:auto}
  .gutter{display:none}
  .side{height:auto;max-height:200px;border-bottom:1px solid var(--line)}
  .cli{height:60vh}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">CONFIG.GEN <small>multivendor CLI builder · v2</small></div>
  <div class="field"><label>Vendor</label>
    <select id="vendor">
      <option value="cisco">Cisco</option>
      <option value="juniper">Juniper</option>
      <option value="arista">Arista</option>
    </select>
  </div>
  <div class="field"><label>OS</label><select id="osel"></select></div>
  <div class="field"><label>Host</label><input id="hostname" value="R1" style="width:110px"/></div>
  <div class="tabs" id="roleTabs">
    <button class="tab on" data-role="router">Router</button>
    <button class="tab" data-role="switch">Switch</button>
    <button class="tab" data-role="firewall">Firewall</button>
  </div>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="tbtn" id="btnDiff" title="Compare with another vendor side-by-side">⇄ Compare</button>
    <select id="diffVendor" style="display:none">
      <option value="cisco">vs Cisco</option>
      <option value="juniper">vs Juniper</option>
      <option value="arista">vs Arista</option>
    </select>
    <button class="tbtn" id="btnLcollapse" title="Collapse sidebar (s)">◧</button>
    <button class="tbtn" id="btnTheme" title="Light/dark">◐</button>
    <button class="tbtn" id="btnReset">Reset</button>
  </div>
</div>

<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="ssearch">
      <input id="navsearch" placeholder="Search sections / fields…" autocomplete="off"/>
    </div>
    <h4>Configuration</h4>
    <nav class="nav" id="nav"></nav>
    <div class="footer">
      <button class="tbtn" id="actLoad" title="Reload sample defaults">⟲ Reload sample</button>
    </div>
  </aside>

  <div class="gutter" id="gutterL"></div>

  <section class="canvas" id="canvas"></section>

  <div class="gutter" id="gutterR"></div>

  <aside class="cli">
    <div class="hdr">
      <div><span class="t">CLI Preview</span><span class="live">● live</span></div>
      <div class="right">
        <button class="tbtn" id="btnCopy" title="Copy to clipboard">Copy</button>
        <button class="tbtn" id="btnDl" title="Download .txt">↓</button>
      </div>
    </div>
    <div class="body" id="cliBody">
      <pre id="cli"></pre>
    </div>
    <div class="ftr"><span id="cliStats">0 lines</span></div>
  </aside>
</div>

<script>
"use strict";

const OS_MAP = {
  cisco:   [["ios","IOS / IOS-XE"],["nxos","NX-OS"],["asa","ASA"]],
  juniper: [["junos","Junos"]],
  arista:  [["eos","EOS"]],
};
const SECTIONS = {
  router:   ["interfaces","static","ospf","bgp","acls","snmp","logging"],
  switch:   ["interfaces","vlans","trunks","stp","ospf","bgp","acls","snmp"],
  firewall: ["interfaces","zones","policies","nat","vpn","static","logging"],
};
const SECTION_LABELS = {
  interfaces:"Interfaces", static:"Static Routes", ospf:"OSPF", bgp:"BGP",
  acls:"ACLs", snmp:"SNMP", logging:"Logging",
  vlans:"VLANs", trunks:"Trunks", stp:"Spanning-Tree",
  zones:"Security Zones", policies:"Security Policies", nat:"NAT", vpn:"IPSec VPN"
};
const SECTION_KEYWORDS = {
  interfaces:"interface ip address mask prefix description shutdown vlan trunk subnet mtu",
  static:"route prefix mask gateway next hop distance default floating",
  ospf:"ospf area router-id wildcard network process passive lsa",
  bgp:"bgp neighbor asn peer router-id as remote network advertised",
  acls:"acl access list permit deny rule src dst port tcp udp icmp",
  snmp:"snmp v3 community user auth priv trap host",
  logging:"logging syslog server level severity facility",
  vlans:"vlan id name",
  trunks:"trunk allowed native vlan interface dot1q",
  stp:"spanning-tree mode priority rapid pvst mst",
  zones:"zone trust untrust dmz interface",
  policies:"policy zone match source destination application action permit deny",
  nat:"nat source destination static interface pool port-forward",
  vpn:"vpn ipsec ike phase psk pre-shared key peer local remote subnet"
};

const state = {
  vendor:"cisco", os:"ios", role:"router", hostname:"R1", section:"interfaces",
  diff:false, diffVendor:"juniper",
  interfaces:[
    {name:"GigabitEthernet0/0", desc:"WAN uplink", ip:"10.0.0.1", mask:"255.255.255.252", prefix:30, enabled:true, mode:"routed", vlan:"", trunkVlans:""},
    {name:"GigabitEthernet0/1", desc:"", ip:"", mask:"", prefix:24, enabled:false, mode:"routed", vlan:"", trunkVlans:""},
    {name:"Loopback0", desc:"Router-ID", ip:"1.1.1.1", mask:"255.255.255.255", prefix:32, enabled:true, mode:"routed", vlan:"", trunkVlans:""},
  ],
  static:[{prefix:"0.0.0.0", mask:"0.0.0.0", nextHop:"10.0.0.2", distance:""}],
  ospf:{processId:"1", routerId:"1.1.1.1", area:"0", networks:[{net:"10.0.0.0",wild:"0.0.0.255",area:"0"}], passiveDefault:true},
  bgp:{asn:"65001", routerId:"1.1.1.1", neighbors:[{ip:"10.0.0.2",remoteAs:"65002",desc:"Upstream ISP"}], networks:[{net:"10.10.10.0",mask:"255.255.255.0"}]},
  acls:[{name:"MGMT", rules:[{seq:10,action:"permit",proto:"tcp",src:"10.0.0.0/24",dst:"any",port:"22"},{seq:20,action:"deny",proto:"ip",src:"any",dst:"any",port:""}]}],
  vlans:[{id:10,name:"USERS"},{id:20,name:"VOICE"},{id:99,name:"MGMT"}],
  trunks:[{intf:"GigabitEthernet1/0/24", allowed:"10,20,99", native:"1"}],
  stp:{mode:"rapid-pvst", priority:""},
  zones:[{name:"trust",interfaces:"GigabitEthernet0/1"},{name:"untrust",interfaces:"GigabitEthernet0/0"}],
  policies:[{name:"ALLOW-WEB",from:"untrust",to:"trust",src:"any",dst:"10.10.10.10/32",app:"HTTPS",action:"permit"}],
  nat:[{type:"source",src:"10.10.10.0/24",translation:"interface",direction:"trust→untrust"}],
  vpn:[{peer:"198.51.100.2", psk:"SECRET", local:"10.10.10.0/24", remote:"10.20.20.0/24"}],
  snmp:{community:"", v3user:"monitor", v3auth:"AUTHPASS", v3priv:"PRIVPASS", host:"10.0.0.50"},
  logging:{host:"10.0.0.50", level:"informational"},
};

const $ = id => document.getElementById(id);

function el(tag,attrs,...kids){
  attrs = attrs || {};
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==="value") e.value = attrs[k];
    else if(k==="checked") e.checked = attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(k=>{
    if(k==null) return;
    e.appendChild(typeof k==="string" || typeof k==="number" ? document.createTextNode(String(k)) : k);
  });
  return e;
}
function inputRow(label, value, onInput, placeholder, tip){
  const inp = el("input",{type:"text",value:value==null?"":value,placeholder:placeholder||"",
    onInput:e=>{onInput(e.target.value); generate(); refreshNav();}});
  const lbl = el("label",{},label);
  if(tip) lbl.appendChild(el("span",{class:"tip","data-tip":tip}, "?"));
  return el("div",{class:"row"}, lbl, inp);
}
function selRow(label, value, options, onChange, tip){
  const sel = el("select",{onChange:e=>{onChange(e.target.value); generate(); refreshNav();}});
  options.forEach(o=>{
    const v = Array.isArray(o)?o[0]:o, t = Array.isArray(o)?o[1]:o;
    const op = el("option",{value:v}, t);
    if(v===value) op.selected = true;
    sel.appendChild(op);
  });
  const lbl = el("label",{},label);
  if(tip) lbl.appendChild(el("span",{class:"tip","data-tip":tip}, "?"));
  return el("div",{class:"row"}, lbl, sel);
}
function checkRow(label, checked, onChange){
  const inp = el("input",{type:"checkbox",checked,
    onChange:e=>{onChange(e.target.checked); generate(); refreshNav();}});
  return el("div",{class:"row"}, el("label",{},label),
    el("div",{class:"check"}, inp, document.createTextNode(checked?"enabled":"disabled")));
}
function entryHeader(name, badges){
  const h = el("div",{class:"head"}, el("div",{class:"name"},name));
  const b = el("div",{class:"badges"});
  (badges||[]).forEach(p=>b.appendChild(el("span",{class:"pill "+p[0]}, p[1])));
  h.appendChild(b);
  return h;
}
function cardBlock(title, ...kids){
  return el("div",{class:"card"}, el("div",{class:"card-title"}, title), ...kids);
}

/* ── Section status (○ / ✓) ── */
const FILL_STATUS = {
  interfaces:()=>{const n=state.interfaces.filter(i=>i.name && (i.ip||i.vlan||i.trunkVlans));return n.length===0?"empty":"filled";},
  static:()=>{const n=state.static.filter(r=>r.prefix&&r.nextHop);return n.length===0?"empty":"filled";},
  ospf:()=>{const n=state.ospf.networks.filter(o=>o.net);return n.length===0?"empty":"filled";},
  bgp:()=>{return (state.bgp.asn && (state.bgp.neighbors.some(n=>n.ip) || state.bgp.networks.some(n=>n.net))) ? "filled":"empty";},
  acls:()=>{const n=state.acls.filter(a=>a.name && a.rules.length);return n.length===0?"empty":"filled";},
  snmp:()=>(state.snmp.community||state.snmp.host)?"filled":"empty",
  logging:()=>state.logging.host?"filled":"empty",
  vlans:()=>state.vlans.filter(v=>v.id).length?"filled":"empty",
  trunks:()=>state.trunks.filter(t=>t.intf).length?"filled":"empty",
  stp:()=>state.stp.mode?"filled":"empty",
  zones:()=>state.zones.filter(z=>z.name).length?"filled":"empty",
  policies:()=>state.policies.filter(p=>p.name).length?"filled":"empty",
  nat:()=>state.nat.filter(n=>n.src).length?"filled":"empty",
  vpn:()=>state.vpn.filter(v=>v.peer).length?"filled":"empty",
};

function renderOsSelect(){
  const sel = $("osel");
  sel.replaceChildren();
  OS_MAP[state.vendor].forEach(o=>{
    const opt = el("option",{value:o[0]}, o[1]);
    sel.appendChild(opt);
  });
  state.os = OS_MAP[state.vendor][0][0];
  sel.value = state.os;
}
function refreshNav(){
  document.querySelectorAll(".nav a").forEach(a=>{
    const s = a.dataset.s;
    if(!s) return;

function applyNavSearch(){
  const q = ($("navsearch").value||"").trim().toLowerCase();
  document.querySelectorAll(".nav a").forEach(a=>{
    const s = a.dataset.s;
    if(!q){ a.classList.remove("hidden"); return; }
    const hay = (SECTION_LABELS[s]+" "+(SECTION_KEYWORDS[s]||"")).toLowerCase();

/* ── Helpers ── */
function maskToPrefix(m){
  if(m==null||m==="") return null;
  m = String(m);
  if(!m.includes(".")) return null;
  const bits = m.split(".").map(x=>parseInt(x,10)).map(x=>x.toString(2).padStart(8,"0")).join("");
  if(/^1*0*$/.test(bits)) return (bits.match(/1/g)||[]).length;
  return null;
}
function pfx(mask, fallback){ const p = maskToPrefix(mask); return p==null ? (fallback==null?24:fallback) : p; }
function prefixToMask(p){
  p = parseInt(p,10); if(isNaN(p)||p<0||p>32) return "";
  const o = [0,0,0,0];
  for(let i=0;i<p;i++) o[Math.floor(i/8)] |= 1<<(7-(i%8));
  return o.join(".");
}
function netMatch(ip,net){
  if(!ip||!net) return false;
  return ip.split(".").slice(0,3).join(".") === net.split(".").slice(0,3).join(".");
}

/* ── Generators (kept intact from v1) ── */
function genCisco(forceOs){
  const useOs = forceOs || state.os;
  const out = [];
  out.push("! "+state.vendor.toUpperCase()+" "+useOs.toUpperCase()+" — "+state.role);
  out.push("hostname "+(state.hostname||"R1"));
  out.push("!");
  if(state.interfaces.length){
    out.push("! --- Interfaces ---");
    state.interfaces.forEach(it=>{
      if(!it.name) return;
      out.push("interface "+it.name);
      if(it.desc) out.push(" description "+it.desc);
      if(state.role==="switch" && it.mode!=="routed"){
        if(it.mode==="trunk"){
          if(useOs==="ios") out.push(" switchport trunk encapsulation dot1q");
          out.push(" switchport mode trunk");
          if(it.trunkVlans) out.push(" switchport trunk allowed vlan "+it.trunkVlans);
        } else {
          out.push(" switchport mode access");
          if(it.vlan) out.push(" switchport access vlan "+it.vlan);
        }
      } else {
        if(state.role==="firewall" && useOs==="asa"){
          const nameif = (it.name||"").toLowerCase().includes("0/0") ? "outside" : "inside";
          out.push(" nameif "+nameif);
          out.push(" security-level "+(nameif==="outside"?0:100));
        }
        if(it.ip){
          if(useOs==="nxos"){
            const p = pfx(it.mask, it.prefix||24);
            out.push(" no switchport");
            out.push(" ip address "+it.ip+"/"+p);
          } else {
            out.push(" ip address "+it.ip+" "+(it.mask||prefixToMask(it.prefix)));
          }
        }
      }
      out.push(it.enabled ? " no shutdown" : " shutdown");
      out.push("!");
    });
  }
  if(state.role!=="switch" && state.static.length){
    out.push("! --- Static routes ---");
    state.static.forEach(r=>{
      if(!r.prefix||!r.mask||!r.nextHop) return;
      if(useOs==="nxos"){
        const p = pfx(r.mask, 24);
        out.push("ip route "+r.prefix+"/"+p+" "+r.nextHop+(r.distance?" "+r.distance:""));
      } else {
        out.push("ip route "+r.prefix+" "+r.mask+" "+r.nextHop+(r.distance?" "+r.distance:""));
      }
    });
    out.push("!");
  }
  if(state.role!=="firewall"){
    const o = state.ospf;
    if(o.networks.some(n=>n.net)){
      out.push("! --- OSPF ---");
      out.push("router ospf "+(o.processId||"1"));
      if(o.routerId) out.push(" router-id "+o.routerId);
      if(o.passiveDefault) out.push(" passive-interface default");
      o.networks.forEach(n=>{ if(n.net) out.push(" network "+n.net+" "+(n.wild||"0.0.0.255")+" area "+(n.area||"0"))});
      out.push("!");
    }
    const b = state.bgp;
    if(b.asn && (b.neighbors.some(n=>n.ip) || b.networks.some(n=>n.net))){
      out.push("! --- BGP ---");
      out.push("router bgp "+b.asn);
      if(b.routerId) out.push(" bgp router-id "+b.routerId);
      b.neighbors.forEach(n=>{
        if(!n.ip) return;
        if(n.desc) out.push(" neighbor "+n.ip+" description "+n.desc);
        out.push(" neighbor "+n.ip+" remote-as "+n.remoteAs);
      });
      out.push(" address-family ipv4");
      b.neighbors.forEach(n=>{ if(n.ip) out.push("  neighbor "+n.ip+" activate")});
      b.networks.forEach(n=>{ if(n.net){
        if(useOs==="nxos") out.push("  network "+n.net+"/"+pfx(n.mask,24));
        else out.push("  network "+n.net+" mask "+n.mask);
      }});
      out.push(" exit-address-family");
      out.push("!");
    }
  }
  state.acls.forEach(a=>{
    if(!a.name) return;
    out.push("! --- ACL "+a.name+" ---");
    out.push("ip access-list extended "+a.name);
    a.rules.forEach(r=>{
      const port = r.port ? " eq "+r.port : "";
      out.push(" "+r.seq+" "+r.action+" "+r.proto+" "+r.src+" "+r.dst+port);
    });
    out.push("!");
  });
  if(state.role==="switch"){
    if(state.vlans.length){
      out.push("! --- VLANs ---");
      state.vlans.forEach(v=>{ if(v.id){out.push("vlan "+v.id); if(v.name) out.push(" name "+v.name);}});
      out.push("!");
    }
    if(state.trunks.length){
      out.push("! --- Trunks ---");
      state.trunks.forEach(t=>{
        if(!t.intf) return;
        out.push("interface "+t.intf);
        if(useOs==="ios") out.push(" switchport trunk encapsulation dot1q");
        out.push(" switchport mode trunk");
        if(t.allowed) out.push(" switchport trunk allowed vlan "+t.allowed);
        if(t.native)  out.push(" switchport trunk native vlan "+t.native);
        out.push("!");
      });
    }
    if(state.stp.mode){
      out.push("spanning-tree mode "+state.stp.mode);
      if(state.stp.priority) out.push("spanning-tree vlan 1-4094 priority "+state.stp.priority);
      out.push("!");
    }
  }
  if(state.role==="firewall" && useOs==="asa"){
    state.policies.forEach((p,i)=>{
      const aclName = p.name || ("POL_"+i);
      out.push("access-list "+aclName+" extended "+p.action+" "+guessAsaProto(p.app)+" "+p.src+" "+p.dst+guessAsaPort(p.app));
      out.push("access-group "+aclName+" in interface "+(p.from||"outside"));
    });
    state.nat.forEach((n,i)=>{
      if(n.type==="source"){
        out.push("object network NAT_"+i);
        out.push(" subnet "+(n.src||"").replace("/"," "));
        out.push(" nat (inside,outside) dynamic interface");
      } else {
        out.push("object network NAT_"+i);
        out.push(" host "+n.translation);
        out.push(" nat (inside,outside) static "+n.src);
      }
    });
    out.push("!");
  }
  if(state.snmp.host || state.snmp.community){
    out.push("! --- SNMP ---");
    if(state.snmp.community) out.push("snmp-server community "+state.snmp.community+" RO");
    if(state.snmp.v3user){
      out.push("snmp-server group OPS v3 priv");
      out.push("snmp-server user "+state.snmp.v3user+" OPS v3 auth sha "+state.snmp.v3auth+" priv aes 128 "+state.snmp.v3priv);
    }
    if(state.snmp.host) out.push("snmp-server host "+state.snmp.host+" version 3 priv "+state.snmp.v3user);
    out.push("!");
  }
  if(state.logging.host){
    out.push("! --- Logging ---");
    out.push("logging host "+state.logging.host);
    out.push("logging trap "+state.logging.level);
    out.push("!");
  }
  out.push("end");
  return out.join("\n");
}
function guessAsaProto(app){
  const a=(app||"").toLowerCase();
  if(a.includes("https")||a.includes("http")||a.includes("ssh")||a.includes("tcp")) return "tcp";
  if(a.includes("udp")||a.includes("dns")||a.includes("snmp")) return "udp";
  if(a.includes("icmp")||a.includes("ping")) return "icmp";
  return "ip";
}
function guessAsaPort(app){
  const a=(app||"").toLowerCase();
  if(a.includes("https")) return " eq 443";
  if(a.includes("http"))  return " eq 80";
  if(a.includes("ssh"))   return " eq 22";
  if(a.includes("dns"))   return " eq 53";
  const m = a.match(/(tcp|udp)\/(\d+)/);
  if(m) return " eq "+m[2];
  return "";
}
function genJunos(){
  const out = [];
  out.push("# Juniper Junos — "+state.role);
  out.push("set system host-name "+(state.hostname||"R1"));
  state.interfaces.forEach(it=>{
    if(!it.name) return;
    const ifn = it.name||"ge-0/0/0";
    if(it.desc) out.push('set interfaces '+ifn+' description "'+it.desc+'"');
    if(state.role==="switch" && it.mode!=="routed"){
      if(it.mode==="trunk"){
        const vlans = (it.trunkVlans||"").split(",").map(x=>x.trim()).filter(Boolean).join(" ");
        out.push("set interfaces "+ifn+" unit 0 family ethernet-switching interface-mode trunk vlan members [ "+vlans+" ]");
      } else if(it.vlan){
        out.push("set interfaces "+ifn+" unit 0 family ethernet-switching interface-mode access vlan members vlan"+it.vlan);
      }
    } else if(it.ip){
      const p = pfx(it.mask, it.prefix||24);
      out.push("set interfaces "+ifn+" unit 0 family inet address "+it.ip+"/"+p);
    }
    if(!it.enabled) out.push("set interfaces "+ifn+" disable");
  });
  if(state.role!=="switch"){
    state.static.forEach(r=>{
      if(!r.prefix||!r.nextHop) return;
      const p = pfx(r.mask, 24);
      out.push("set routing-options static route "+r.prefix+"/"+p+" next-hop "+r.nextHop+(r.distance?" preference "+r.distance:""));
    });
  }
  if(state.role!=="firewall"){
    const o = state.ospf;
    if(o.routerId) out.push("set routing-options router-id "+o.routerId);
    o.networks.forEach(n=>{
      if(!n.net) return;
      const matchIf = state.interfaces.find(it=>it.ip && netMatch(it.ip,n.net));
      const ifn = matchIf ? matchIf.name+".0" : "ge-0/0/0.0";
      out.push("set protocols ospf area 0.0.0."+(n.area||"0")+" interface "+ifn);
    });
    const b = state.bgp;
    if(b.asn) out.push("set routing-options autonomous-system "+b.asn);
    b.neighbors.forEach(n=>{
      if(!n.ip) return;
      const grpName = n.remoteAs===b.asn ? "INTERNAL" : "EXTERNAL";
      const grpType = n.remoteAs===b.asn ? "internal" : "external";
      out.push("set protocols bgp group "+grpName+" type "+grpType);
      out.push("set protocols bgp group "+grpName+" neighbor "+n.ip+" peer-as "+n.remoteAs);
      if(n.desc) out.push('set protocols bgp group '+grpName+' neighbor '+n.ip+' description "'+n.desc+'"');
    });
    b.networks.forEach((n,i)=>{
      if(!n.net) return;
      const p = pfx(n.mask, 24);
      out.push("set policy-options policy-statement EXPORT-"+i+" term 1 from route-filter "+n.net+"/"+p+" exact");
      out.push("set policy-options policy-statement EXPORT-"+i+" term 1 then accept");
    });
  }
  state.acls.forEach(a=>{
    if(!a.name) return;
    a.rules.forEach(r=>{
      const t = "T"+r.seq;
      if(r.src!=="any") out.push("set firewall family inet filter "+a.name+" term "+t+" from source-address "+r.src);
      if(r.dst!=="any") out.push("set firewall family inet filter "+a.name+" term "+t+" from destination-address "+r.dst);
      if(r.proto!=="ip") out.push("set firewall family inet filter "+a.name+" term "+t+" from protocol "+r.proto);
      if(r.port)        out.push("set firewall family inet filter "+a.name+" term "+t+" from destination-port "+r.port);
      out.push("set firewall family inet filter "+a.name+" term "+t+" then "+(r.action==="permit"?"accept":"discard"));
    });
  });
  if(state.role==="switch"){
    state.vlans.forEach(v=>{ if(v.id) out.push("set vlans vlan"+v.id+" vlan-id "+v.id); });
    state.trunks.forEach(t=>{
      if(!t.intf) return;
      const vlans = (t.allowed||"").split(",").map(x=>"vlan"+x.trim()).filter(x=>x!=="vlan").join(" ");
      out.push("set interfaces "+t.intf+" unit 0 family ethernet-switching interface-mode trunk vlan members [ "+vlans+" ]");
      if(t.native) out.push("set interfaces "+t.intf+" native-vlan-id "+t.native);
    });
  }
  if(state.role==="firewall"){
    state.zones.forEach(z=>{
      if(!z.name) return;
      (z.interfaces||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(ifc=>{
        out.push("set security zones security-zone "+z.name+" interfaces "+ifc+".0");
      });
    });
    state.policies.forEach(p=>{
      if(!p.name) return;
      const path = "security policies from-zone "+p.from+" to-zone "+p.to+" policy "+p.name;
      out.push("set "+path+" match source-address "+(p.src==="any"?"any":p.name+"-src"));
      out.push("set "+path+" match destination-address "+(p.dst==="any"?"any":p.name+"-dst"));
      out.push("set "+path+" match application "+(p.app||"any"));
      out.push("set "+path+" then "+p.action);
    });
    state.nat.forEach((n,i)=>{
      const dir = (n.direction||"trust→untrust").split("→");
      const fromZ = dir[0]; const toZ = dir[1]||"untrust";
      if(n.type==="source"){
        const rs = "NAT-SRC-"+i;
        out.push("set security nat source rule-set "+rs+" from zone "+fromZ);
        out.push("set security nat source rule-set "+rs+" to zone "+toZ);
        out.push("set security nat source rule-set "+rs+" rule R"+i+" match source-address "+n.src);
        out.push("set security nat source rule-set "+rs+" rule R"+i+" then source-nat "+(n.translation==="interface"?"interface":"pool "+n.translation));
      } else {
        out.push("set security nat destination pool DNAT-"+i+" address "+n.translation);
        out.push("set security nat destination rule-set DNAT from zone "+fromZ);
        out.push("set security nat destination rule-set DNAT rule R"+i+" match destination-address "+n.src);
        out.push("set security nat destination rule-set DNAT rule R"+i+" then destination-nat pool DNAT-"+i);
      }
    });
    state.vpn.forEach((v,i)=>{
      if(!v.peer) return;
      const id = "VPN-"+i;
      out.push("set security ike proposal "+id+"-P1 authentication-method pre-shared-keys");
      out.push("set security ike proposal "+id+"-P1 dh-group group14");
      out.push("set security ike proposal "+id+"-P1 authentication-algorithm sha-256");
      out.push("set security ike proposal "+id+"-P1 encryption-algorithm aes-256-cbc");
      out.push("set security ike policy "+id+"-POL proposals "+id+"-P1");
      out.push('set security ike policy '+id+'-POL pre-shared-key ascii-text "'+v.psk+'"');
      out.push("set security ike gateway "+id+"-GW ike-policy "+id+"-POL address "+v.peer);
      out.push("set security ipsec vpn "+id+" ike gateway "+id+"-GW");
    });
  }
  if(state.snmp.community) out.push("set snmp community "+state.snmp.community+" authorization read-only");
  if(state.snmp.v3user){
    out.push('set snmp v3 usm local-engine user '+state.snmp.v3user+' authentication-sha authentication-password "'+state.snmp.v3auth+'"');
    out.push('set snmp v3 usm local-engine user '+state.snmp.v3user+' privacy-aes128 privacy-password "'+state.snmp.v3priv+'"');
  }
  if(state.logging.host) out.push("set system syslog host "+state.logging.host+" any "+state.logging.level);
  return out.join("\n");
}
function genEos(){
  let lines = genCisco().split("\n");
  lines = lines.map(l=>{
    let m = l.match(/^( *)ip address (\d+\.\d+\.\d+\.\d+) (\d+\.\d+\.\d+\.\d+)$/);
    if(m){ const p = maskToPrefix(m[3]); if(p!=null) return m[1]+"ip address "+m[2]+"/"+p; }
    m = l.match(/^ip route (\d+\.\d+\.\d+\.\d+) (\d+\.\d+\.\d+\.\d+) (.+)$/);
    if(m){ const p = maskToPrefix(m[2]); if(p!=null) return "ip route "+m[1]+"/"+p+" "+m[3]; }
    m = l.match(/^( *)network (\d+\.\d+\.\d+\.\d+) mask (\d+\.\d+\.\d+\.\d+)$/);
    if(m){ const p = maskToPrefix(m[3]); if(p!=null) return m[1]+"network "+m[2]+"/"+p; }
    return l;
  });
  lines[0] = "! Arista EOS — "+state.role;
  return lines.join("\n");
}
function genFor(vendor){
  const savedVendor = state.vendor, savedOs = state.os;
  state.vendor = vendor;
  state.os = OS_MAP[vendor][0][0];
  let out;
  if(vendor==="juniper") out = genJunos();
  else if(vendor==="arista") out = genEos();
  else out = genCisco();
  state.vendor = savedVendor; state.os = savedOs;
  return out;
}

/* ── CLI render with multi-color highlighting ── */
const IF_PREFIXES = ["GigabitEthernet","FastEthernet","TenGigabitEthernet","Ethernet","Et","Loopback","Vlan","Port-channel","Port-Channel","Serial","ge-","xe-","et-","ae","lo","irb","fxp","me","ma","fa0/","Gi","TenGig"];
function renderCmdLine(line){
  const span = el("span",{});
  if(line.startsWith("!") || line.startsWith("#")){
    const c = el("span",{class:"c"+(line.includes("---")?" anchor":"")}, line);
    if(line.includes("---")){
      c.title = "Click to jump to section";
      c.addEventListener("click",()=>{
        const m = line.match(/---\s*(\w+)/);
        if(!m) return;
        const target = m[1].toLowerCase();
        for(const s of SECTIONS[state.role]){
          if(SECTION_LABELS[s].toLowerCase().startsWith(target) || s.startsWith(target)){
            state.section = s; renderNav(); renderContent(); break;
          }
        }
      });
    }
    span.appendChild(c);
    return span;
  }
  const m = line.match(/^( *)(.*)$/);
  if(m[1]) span.appendChild(document.createTextNode(m[1]));
  const tokens = m[2].split(/(\s+)/);
  tokens.forEach((tok,idx)=>{
    if(!tok) return;
    if(/^\s+$/.test(tok)){ span.appendChild(document.createTextNode(tok)); return; }
    // First non-space token = keyword
    if(idx === 0 || (idx <= 2 && /^[a-z]+(-[a-z]+)*$/.test(tok))){
      span.appendChild(el("span",{class:"k"}, tok));
      return;
    }
    // IP address
    if(/^\d+\.\d+\.\d+\.\d+(\/\d+)?$/.test(tok)){
      span.appendChild(el("span",{class:"ip"}, tok));
      return;
    }
    // Pure number
    if(/^\d+$/.test(tok)){
      span.appendChild(el("span",{class:"num"}, tok));
      return;
    }
    // Interface name
    if(IF_PREFIXES.some(p=>tok.startsWith(p))){
      span.appendChild(el("span",{class:"if"}, tok));
      return;
    }
    // common config keywords
    if(["interface","ip","ipv6","router","ospf","bgp","vlan","set","permit","deny","access-list","switchport","spanning-tree","address","mask","route","trunk","mode","access","network","area","neighbor","remote-as","family","unit","members","native","encapsulation","dot1q","description","shutdown","snmp-server","logging","host","community","version","trap","priority","no","group","static","next-hop","preference","peer-as","type","external","internal","activate","exit-address-family","passive-interface","router-id","authentication-method","pre-shared-keys","dh-group","authentication-algorithm","encryption-algorithm","pre-shared-key","ascii-text","gateway","ike-policy","ipsec","ike","proposal","policy","zone","zones","security-zone","security","interfaces","destination-address","source-address","destination-port","source-port","destination","source","application","then","match","from","to","accept","discard","reject","nat","pool","rule-set","rule","add","remove"].includes(tok.toLowerCase())){
      span.appendChild(el("span",{class:"k"}, tok));
      return;
    }
    span.appendChild(el("span",{class:"v"}, tok));
  });
  return span;
}
function paintInto(pre, txt){
  pre.replaceChildren();
  const lines = txt.split("\n");
  lines.forEach((line,idx)=>{
    if(idx>0) pre.appendChild(document.createTextNode("\n"));
    pre.appendChild(renderCmdLine(line));
  });
  pre._raw = txt;
  return lines.length;
}

function generate(){
  const body = $("cliBody");
  let txt, lines;
  if(state.diff && state.diffVendor !== state.vendor){
    body.classList.add("split");
    body.replaceChildren();
    const myCol = el("div",{class:"splitcol "+state.vendor},
      el("div",{class:"colhdr"}, state.vendor.toUpperCase()+" — "+OS_MAP[state.vendor][0][1]));
    const myPre = el("pre",{id:"cli"});
    myCol.appendChild(myPre);
    const otherCol = el("div",{class:"splitcol "+state.diffVendor},
      el("div",{class:"colhdr"}, state.diffVendor.toUpperCase()+" — "+OS_MAP[state.diffVendor][0][1]));
    const otherPre = el("pre");
    otherCol.appendChild(otherPre);
    body.appendChild(myCol);
    body.appendChild(otherCol);
    txt = state.vendor==="juniper" ? genJunos() : state.vendor==="arista" ? genEos() : genCisco();
    paintInto(myPre, txt);
    paintInto(otherPre, genFor(state.diffVendor));
    lines = txt.split("\n").length;
  } else {
    body.classList.remove("split");
    body.replaceChildren();
    const pre = el("pre",{id:"cli"});
    body.appendChild(pre);
    txt = state.vendor==="juniper" ? genJunos() : state.vendor==="arista" ? genEos() : genCisco();
    lines = paintInto(pre, txt);
  }
  $("cliStats").textContent = lines + " line"+(lines!==1?"s":"");
  refreshNav();
}

/* Resizers */
function makeResizer(gutter, isLeft){
  let startX, startW;
  gutter.addEventListener("mousedown",e=>{
    e.preventDefault();
    startX = e.clientX;
    const cs = getComputedStyle(document.documentElement);
    startW = parseInt(cs.getPropertyValue(isLeft?"--lcol":"--rcol")) || (isLeft?200:460);
    const move = (mv)=>{
      const delta = mv.clientX - startX;
      let next = isLeft ? Math.max(140, Math.min(420, startW + delta)) : Math.max(280, Math.min(900, startW - delta));
      document.documentElement.style.setProperty(isLeft?"--lcol":"--rcol", next+"px");
    };
    const up = ()=>{
      document.removeEventListener("mousemove",move);
      document.removeEventListener("mouseup",up);
    };
    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",up);
  });
}
makeResizer($("gutterL"), true);
makeResizer($("gutterR"), false);

document.addEventListener("keydown",e=>{
  const tgt = document.activeElement;
  if(tgt && (tgt.tagName==="INPUT" || tgt.tagName==="SELECT" || tgt.tagName==="TEXTAREA")) return;
  if(e.key === "s"){ $("shell").classList.toggle("lcollapsed"); }
  else if(e.key === "/"){ e.preventDefault(); $("navsearch").focus(); }
  else if(e.key === "d"){ $("btnDiff").click(); }
});

renderOsSelect();
